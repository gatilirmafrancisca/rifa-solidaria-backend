name: Testes Backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # mongodb-memory-server baixa um binário do Mongo na primeira
      # vez — cachear isso deixa os próximos runs bem mais rápidos.
      - name: Cache do binário do MongoDB em memória
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm run test:bdd
        env:
          JWT_SECRET: segredo-de-teste-ci
          MP_ACCESS_TOKEN: fake-nao-usado-em-testes-mockados